<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ValMod-安装脚本</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 24px;
      font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: #000;
      line-height: 1.7;
    }
    h1 { font-size: 32px; margin-bottom: 24px; }
    p { margin-bottom: 24px; }
    a.install {
      display: block;
      width: 100%;
      padding: 14px;
      border: 1px solid #000;
      color: #000;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      margin-bottom: 32px;
    }
    ol { padding-left: 24px; margin-bottom: 24px; }
    a.link { color: #000; }
  </style>
</head>
<body>
  <h1>ValMod</h1>
  <p>Scratch 变量修改器</p>

  <a class="install" href="https://NekoYoAE.github.io/ValMod/ValMod.user.js">点击安装脚本</a>

  <ol>
    <li>安装 <a class="link" href="https://www.tampermonkey.net/" target="_blank" rel="noopener">篡改猴插件</a>（或 Violentmonkey）扩展</li>
    <li>点击上方「点击安装脚本」按钮</li>
    <li>在 篡改猴 弹窗中点击「安装」</li>
  </ol>

</body>
</html>
